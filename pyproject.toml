[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mtaaniwatch"
version = "0.1.0"
description = "Community incident reporting and field-response coordination prototype"
requires-python = ">=3.11"
dependencies = [
    "africastalking>=2.0.3,<3.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "alembic>=1.14,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<2.1",
    # The demo seed stamps Africa/Nairobi times; slim base images may ship no
    # system zoneinfo database.
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.scripts]
mtaaniwatch-seed = "scripts.seed_demo_data:seed"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
